name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # lint:check, not lint: `npm run lint` autofixes, which in CI would
      # quietly repair a problem and report success on code that was never
      # actually clean.
      - name: Lint
        run: npm run lint:check

      # Runs the suite with coverage so the thresholds in vitest.config.mts
      # are actually enforced; a plain `npm test` would skip them entirely.
      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build:prod

      - name: Verify package contents
        run: npm pack --dry-run
