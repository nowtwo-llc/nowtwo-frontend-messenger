name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, and let a newer run supersede a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:prod

      # The demo is served at /example/ so its `../dist/...` asset paths resolve
      # exactly as they do when you open example/index.html locally after a
      # build. The root redirect just makes the Pages URL land on it.
      - name: Assemble site
        run: |
          mkdir -p _site/example _site/dist
          cp -R example/. _site/example/
          cp -R dist/. _site/dist/
          cat > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
              <head>
                  <meta charset="utf-8" />
                  <title>Frontend Messenger</title>
                  <meta http-equiv="refresh" content="0; url=./example/" />
              </head>
              <body><a href="./example/">Frontend Messenger demo</a></body>
          </html>
          HTML

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
