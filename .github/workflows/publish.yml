name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# The public npm registry is the only place this package is published.
# publishConfig in package.json carries `access: public` and deliberately pins
# no registry, so the registry-url set below is what takes effect.
jobs:
  npm:
    name: npm (public)
    runs-on: ubuntu-latest

    # Gates the release behind the required reviewers configured on this
    # environment, so pushing a v* tag queues a publish rather than performing
    # one. The name must match the "Environment" field on the trusted publisher
    # at npmjs.com — GitHub puts it in the OIDC claim, and npm rejects the
    # publish if the two disagree.
    environment: npm-publish

    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC). Without it the publish
      # falls back to looking for a token and fails.
      id-token: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # Trusted publishing needs Node >= 22.14.0.
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      # setup-node ships npm 10.x, but trusted publishing needs >= 11.5.1.
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      # A tag that disagrees with package.json publishes a surprising version,
      # and neither registry will let you take it back.
      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME implies version $TAG_VERSION but package.json is $PKG_VERSION" >&2
            exit 1
          fi
          echo "Publishing version $PKG_VERSION"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # No NODE_AUTH_TOKEN: the OIDC token from `id-token: write` authenticates
      # against the trusted publisher configured on npmjs.com, and npm attaches
      # build provenance automatically.
      #
      # `prepublishOnly` runs the production build, so dist/ is always freshly
      # generated from the tagged source rather than whatever was on disk.
      - name: Publish to npm
        run: npm publish
