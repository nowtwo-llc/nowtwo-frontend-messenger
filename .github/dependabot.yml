version: 2

updates:
  # Workflow actions are the highest-value thing to keep current: a compromised
  # or stale action runs with this repo's token on every push.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      # One PR for the routine dev-tooling churn instead of a dozen.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # jsdom's engines floor drives the Node version in .nvmrc and CI. A major
      # bump can raise that floor out from under both, which surfaces as an
      # unrelated-looking test crash rather than an install error, so it is
      # taken deliberately.
      - dependency-name: jsdom
        update-types:
          - version-update:semver-major
